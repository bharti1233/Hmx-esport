name: Liquid Glass visual verification

on:
  push:
    branches:
      - "feature/hmx-arena-android-production"
    paths:
      - "app/src/main/java/com/hmx/arena/core/designsystem/**"
      - "app/src/main/java/com/hmx/arena/ui/**"
      - "app/src/debug/**"
      - "app/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-visual.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/hmx/arena/core/designsystem/**"
      - "app/src/main/java/com/hmx/arena/ui/**"
      - "app/src/debug/**"
      - ".github/workflows/android-visual.yml"
  workflow_dispatch:

concurrency:
  group: android-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Build debug APK and capture emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Liquid Glass screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none
          script: |
            bash .github/scripts/capture-liquid-glass.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmx-liquid-glass-screenshots
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
